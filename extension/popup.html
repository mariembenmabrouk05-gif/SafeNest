<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title> SafeNest</title>
    <style>
        body {
            width: 300px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            background: #0B1B44;
            color: white;
            margin: 0;
        }

        h2 {
            font-size: 16px;
            margin-top: 0;
            color: #3CB4A8;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #B7AED6;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #6A64B6;
            border-radius: 4px;
            background: #2C345D;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #EBCC84;
            color: #0B1B44;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d6b772;
        }

        #status {
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            color: #3CB4A8;
        }
    </style>
</head>

<body>
    <h2>Configuration SafeNest</h2>

    <div class="form-group">
        <label>URL de l'API</label>
        <input type="text" id="apiUrl" placeholder="http://localhost/SafeNestt/SafeNest/api/add_site.php">
    </div>

    <div class="form-group">
        <label>ID Enfant</label>
        <input type="number" id="childId" placeholder="Ex: 2">
    </div>

    <button id="saveBtn">Sauvegarder</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>

</html>
